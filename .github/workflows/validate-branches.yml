name: Validate branches

# Upstream only runs Validate on pull_request against main, so a cross-fork PR
# shows no checks at all until a maintainer approves the workflow run. This copy
# lives on the fork only (it is not part of the pull request) and gives every
# pushed branch a real build-and-test result to point at.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore VirtualTabGroups.sln

      - name: Build (Debug x64)
        run: msbuild VirtualTabGroups.sln /p:Configuration=Debug /p:Platform=x64

      - name: Run tests
        run: dotnet test tests/VirtualTabGroups.Tests/VirtualTabGroups.Tests.csproj --nologo
